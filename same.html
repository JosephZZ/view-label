const KEY = 'same-label-v1'; let A = JSON.parse(localStorage.getItem(KEY) || '{}'); let i = 0;
const OPTS = [['s', '同一个'], ['u', '拿不准'], ['d', '不同']];
const save = () => { localStorage.setItem(KEY, JSON.stringify(A)); document.getElementById('prog').textContent = `已答 ${Object.keys(A).length} / ${ITEMS.length}`; };
function render() {
  const t = ITEMS[i]; document.getElementById('pos').textContent = `第 ${t.q} 对 / ${ITEMS.length}`;
  let h = `<div class="pair"><img src="${t.a}"><img src="${t.b}"></div><div class="ans">`;
  OPTS.forEach(([v, l]) => { h += `<button data-v="${v}" class="${A[t.q] === v ? 'sel' : ''}">${l}</button>`; });
  h += `</div>`; const c = document.getElementById('card'); c.innerHTML = h;
  c.querySelectorAll('.ans button').forEach(b => b.onclick = () => { A[t.q] = b.dataset.v; save(); if (i < ITEMS.length - 1) { i++; } render(); });
  save(); window.scrollTo(0, 0);
}
document.getElementById('prev').onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById('next').onclick = () => { if (i < ITEMS.length - 1) { i++; render(); } };
document.getElementById('out').onclick = () => { const s = ITEMS.map(t => `${t.q}${({s: '同', u: '?', d: '不'})[A[t.q]] || '-'}`).join(' ');
  const r = document.getElementById('res'); r.style.display = 'block'; r.value = s; r.select(); try { navigator.clipboard.writeText(s); } catch (e) {} };
render();
