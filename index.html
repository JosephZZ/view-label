const KEY = 'c-label-v1'; let A = JSON.parse(localStorage.getItem(KEY) || '{}'); let i = 0;
const save = () => { localStorage.setItem(KEY, JSON.stringify(A)); document.getElementById('prog').textContent = `已答 ${Object.keys(A).filter(k => A[k].length).length} / ${ITEMS.length}`; };
function render() {
  const t = ITEMS[i]; const a = A[t.q] || (A[t.q] = []);
  document.getElementById('pos').textContent = `第 ${t.q} 题 / ${ITEMS.length}`;
  let h = `<div class="hint">复刻：</div><img class="rep" src="${t.rep}"><div class="hint">原作里的东西（点选）：</div><div class="opts">`;
  t.opts.forEach((o, k) => { h += `<div class="opt ${a.includes(k) ? 'sel' : ''}" data-k="${k}"><img src="${o}"><div>${'ABC'[k]}</div></div>`; });
  h += `</div><label class="none"><input type="checkbox" id="none" ${a.includes(-1) ? 'checked' : ''}> 都不像</label>`;
  const c = document.getElementById('card'); c.innerHTML = h;
  c.querySelectorAll('.opt').forEach(e => e.onclick = () => { const k = +e.dataset.k; const j = a.indexOf(k); if (j >= 0) a.splice(j, 1); else { a.push(k); const n = a.indexOf(-1); if (n >= 0) a.splice(n, 1); } save(); render(); });
  document.getElementById('none').onchange = e => { A[t.q] = e.target.checked ? [-1] : []; save(); render(); };
  save(); window.scrollTo(0, 0);
}
document.getElementById('prev').onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById('next').onclick = () => { if (i < ITEMS.length - 1) { i++; render(); } };
document.getElementById('out').onclick = () => { const s = ITEMS.map(t => `${t.q}:${(A[t.q] || []).map(k => k < 0 ? '无' : 'ABC'[k]).join('') || '-'}`).join(' ');
  const r = document.getElementById('res'); r.style.display = 'block'; r.value = s; r.select(); try { navigator.clipboard.writeText(s); } catch (e) {} };
render();
</script></body></html>
